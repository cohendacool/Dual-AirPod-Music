workflows:
  dual-airpod-ios:
    name: Dual AirPod Music iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: lts
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci
          npm ls @capacitor/core @capacitor/cli @capacitor/ios
          test -d node_modules/@capacitor/ios || {
            echo "ERROR: @capacitor/ios is missing from node_modules."
            exit 1
          }

      - name: Inspect Capacitor project
        script: |
          npx cap --version
          npx cap ls
          ls -la ios
          find ios -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" -o -name "Podfile" \) -print

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      
      - name: Build iOS app
        script: |
          mkdir -p /tmp/xcodebuild_logs build

          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -resultBundlePath build/Build.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild_logs/xcodebuild.log

      - name: Package unsigned IPA
        script: |
          APP_PATH="build/Build/Products/Debug-iphoneos/App.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r DualAirPodMusic-unsigned.ipa Payload
          mkdir -p artifacts
          mv DualAirPodMusic-unsigned.ipa artifacts/

    artifacts:
      - artifacts/*.ipa
      - build/Build/Products/Debug-iphoneos/*.app
      - /tmp/xcodebuild_logs/**/*.log
