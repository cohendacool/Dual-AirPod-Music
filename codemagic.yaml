
workflows:
  dual-airpod-ios:
    name: Dual AirPod Music iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: lts
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Create iOS project if needed
        script: |
          if [ ! -f ios/App/Podfile ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Verify Podfile exists
        script: |
          if [ ! -f ios/App/Podfile ]; then
            echo "ERROR: ios/App/Podfile was not generated."
            exit 1
          fi

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Build iOS app
        script: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/Build/Products/Debug-iphoneos/*.app
      - /tmp/xcodebuild_logs/**/*.log
