workflows:
  dual-airpod-ios:
    name: Dual AirPod Music iOS
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: lts
      xcode: latest

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Inspect Capacitor project
        script: |
          npx cap --version
          npx cap ls
          ls -la ios
          find ios -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" -o -name "Podfile" \) -print

      - name: Sync Capacitor iOS project
        script: npx cap sync ios

      - name: Build iOS app
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/Build/Products/Debug-iphoneos/*.app
      - /tmp/xcodebuild_logs/**/*.log
